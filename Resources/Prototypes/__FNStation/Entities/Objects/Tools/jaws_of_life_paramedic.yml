- type: entity
  name: челюсти жизни парамедика
  parent: JawsOfLife
  id: ParamedicJawsOfLife
  description: Useful for entering the station or its departments.
  components:
  - type: Tag
    tags:
    - ParamedicJawsOfLife
  - type: Sprite
    sprite: _FNStation/Objects/Tools/jaws_paramedic.rsi
    state: jaws_pry
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
    size: Normal
  - type: Prying
    speedModifier: 3.0
  - type: MultipleTool
    entries:
      - behavior: Prying
        sprite:
          sprite: _FNStation/Objects/Tools/jaws_paramedic.rsi
          state: jaws_pry
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: Cutting
        sprite:
          sprite: _FNStation/Objects/Tools/jaws_paramedic.rsi
          state: jaws_cutter
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg