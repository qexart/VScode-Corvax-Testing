# MEDICAL
- type: entity
  parent: ClothingOuterStorageFoldableBase
  id: ClothingOuterCoatLabCoroner
  name: лабораторный халат коронера
  description: Изготовленный по специальному заказу синий лабораторный халат главного врача обеспечивает дополнительную защиту от разливов химикатов и мелких порезов.
  components:
  - type: Sprite
    sprite: _FNStation/Clothing/OuterClothing/Coats/labcoat_coroner.rsi
  - type: Clothing
    sprite: _FNStation/Clothing/OuterClothing/Coats/labcoat_coroner.rsi
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.75

- type: entity
  parent: [ClothingOuterStorageFoldableBaseOpened, ClothingOuterCoatLabCoroner]
  id: ClothingOuterCoatLabCoronerOpened
  name: лабораторный халат коронера

- type: entity
  parent: ClothingOuterStorageFoldableBase
  id: ClothingOuterCoatParamedic
  name: ветровка парамедика
  description: A suit that protects against minor chemical spills. Has an orange stripe on the shoulder.
  components:
  - type: Sprite
    sprite: _FNStation/Clothing/OuterClothing/Coats/paramedic_coat.rsi
  - type: Clothing
    sprite: _FNStation/Clothing/OuterClothing/Coats/paramedic_coat.rsi
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.90
        Caustic: 0.85

- type: entity
  parent: [ClothingOuterStorageFoldableBaseOpened, ClothingOuterCoatParamedic]
  id: ClothingOuterCoatParamedicOpened
  name: куртка парамедика

