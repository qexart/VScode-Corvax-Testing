# Base benches
- type: entity
  name: скамья
  id: BenchBaseMiddle
  suffix: Middle
  abstract: true
  parent: SeatBase
  description: Multiple seats spanning a single object. Truly a marvel of science.
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    state: middle
  - type: StaticPrice # Frontier
    price: 50 # Frontier: 20

# Park benches
- type: entity
  name: скамья
  suffix: Центральные, парк
  id: BenchParkMiddle
  parent: BenchBaseMiddle
  components:
  - type: Sprite
    sprite: _FNStation/Structures/Furniture/Benches/parkbench_wooden.rsi
  - type: Construction # Frontier
    graph: BenchesGraph # Frontier
    node: BenchParkMiddleNode # Frontier
  - type: StaticPrice # Frontier
    price: 50 # Frontier: 30

- type: entity
  id: BenchParkLeft
  suffix: Левые, парк
  parent: BenchParkMiddle
  components:
  - type: Sprite
