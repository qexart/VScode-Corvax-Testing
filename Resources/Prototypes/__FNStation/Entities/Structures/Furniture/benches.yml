# Standard sofa
- type: entity
  name: диван
  suffix: Центральные, коричневый
  id: BenchSofaMiddle
  parent: BenchBaseMiddle
  components:
  - type: Sprite
    sprite: _FNStation/Structures/Furniture/Benches/sofa.rsi
  - type: Construction # Frontier
    graph: SofasGraph # Frontier
    node: BenchSofaMiddleNode # Frontier
  - type: StaticPrice # Frontier
    price: 50 # Frontier: 25

- type: entity
  id: BenchSofaLeft
  suffix: Левые, коричневый
  parent: BenchSofaMiddle
  components:
  - type: Sprite
    state: left
  - type: Construction # Frontier
    graph: SofasGraph # Frontier
    node: BenchSofaLeftNode # Frontier

- type: entity
  id: BenchSofaRight
  suffix: Правые, коричневый
  parent: BenchSofaMiddle
  components:
  - type: Sprite
    state: right
  - type: Construction # Frontier
    graph: SofasGraph # Frontier
    node: BenchSofaRightNode # Frontier
    
- type: entity
  name: диван
  id: BenchSofaCorner
  suffix: Угол, коричневый
  parent: BenchSofaMiddle
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    sprite: _FNStation/Structures/Furniture/Benches/sofa.rsi
    state: corner
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Construction # Frontier
    graph: SofasGraph # Frontier
    node: BenchSofaCornerNode # Frontier

