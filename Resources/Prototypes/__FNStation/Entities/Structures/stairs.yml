# Wood - Base

- type: entity
  id: WoodStairsBase
  parent: SteelStairsBase
  name: ступеньки
  abstract: true
  description: По ним точно не стоит бегать.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _FNStation/Structures/Floor/Stairs/wood.rsi
    drawdepth: FloorTiles
  - type: Transform
    anchored: true
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood
      params:
        volume: 8
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.8
    sprintSpeedModifier: 0.8
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
          #bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - SlipLayer
        density: 1000
        hard: false
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Dark Steel - Base

- type: entity
  id: DarkSteelStairsBase
  parent: SteelStairsBase
  name: ступеньки
  abstract: true
  description: Прочные стальные ступеньки, по ним точно не стоит бегать.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _FNStation/Structures/Floor/Stairs/dark_steel.rsi
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 8
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 225
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

